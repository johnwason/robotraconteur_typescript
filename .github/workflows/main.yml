name: CI

on:
  push:
  pull_request:
  release:
    types:
    - created

  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  PYTHON_VERSION: "3.12"
  RR_CORE_VERSION: v1.2.9

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RR_CORE_TEST: ${{ github.workspace }}/rr-core/test
    steps:
    - uses: actions/checkout@v4
    - name: Checkout Robot Raconteur Core test services
      uses: actions/checkout@v4
      with:
        repository: robotraconteur/robotraconteur
        ref: ${{ env.RR_CORE_VERSION }}
        path: rr-core
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Python dependencies
      run: python -m pip install "robotraconteur==${RR_CORE_VERSION#v}" numpy pytest
    - name: Install Node.js dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Build
      run: npm run build
    - name: Check that the browser file is up to date
      run: git diff --exit-code examples/robotraconteur.min.js
    - name: Test
      run: npm test
    - name: Bundle size
      run: npm run size
    - name: Build npm package
      run: npm pack
    - name: Upload npm package
      uses: actions/upload-artifact@v4
      with:
        name: npm-package
        path: ./*.tgz
