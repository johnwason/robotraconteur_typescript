name: Docs

# Builds the documentation site on every push and pull request, failing on any TypeDoc warning, such
# as an undocumented export or a broken link. Pushes to dev publish it with GitHub Pages, which must
# be set to deploy from GitHub Actions in the repository settings.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Build the documentation
      run: npm run docs
    - name: Upload the site
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publish to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
